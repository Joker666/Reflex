name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and release
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify the tag and app version
        run: |
          app_version=$(xcodebuild -project Reflex.xcodeproj -scheme Reflex -configuration Release -showBuildSettings CODE_SIGNING_ALLOWED=NO | awk '$1 == "MARKETING_VERSION" { print $3; exit }')
          tag_version=${GITHUB_REF_NAME#v}
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version." >&2
            exit 1
          fi

      - name: Install the Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Developer ID certificate secrets are not configured." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/reflex-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Write the notarization API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [[ -z "$API_KEY_BASE64" ]]; then
            echo "The App Store Connect API key secret is not configured." >&2
            exit 1
          fi
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build and notarize the app
        env:
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/release
        run: |
          if [[ -z "$APPLE_API_KEY_ID" ]]; then
            echo "The notarization API key identifier is not configured." >&2
            exit 1
          fi
          ./Scripts/distribute.sh

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          disk_image=$(find "$RUNNER_TEMP/release" -maxdepth 1 -name 'Reflex-*.dmg' -print -quit)
          if [[ -z "$disk_image" ]]; then
            echo "The release disk image was not created." >&2
            exit 1
          fi
          canonical_dmg="$RUNNER_TEMP/release/Reflex.dmg"
          cp "$disk_image" "$canonical_dmg"
          gh release create "$GITHUB_REF_NAME" \
            "$disk_image" \
            "$disk_image.sha256" \
            "$canonical_dmg" \
            --verify-tag \
            --generate-notes \
            --title "Reflex $GITHUB_REF_NAME"

      - name: Remove signing files
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security delete-keychain "$RUNNER_TEMP/reflex-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
